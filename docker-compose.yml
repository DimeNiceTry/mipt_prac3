name: mipt-prac3

x-node: &node
  image: mipt-prac3-node:local
  build:
    context: ./docker/node
  networks:
    - lab
  depends_on:
    master:
      condition: service_healthy

services:
  master:
    build:
      context: ./docker/master
    image: mipt-prac3-master:local
    working_dir: /workspace
    environment:
      ANSIBLE_CONFIG: /workspace/ansible.cfg
    volumes:
      - .:/workspace:ro
      - controller_ssh:/root/.ssh
      - public_keys:/publickeys
    networks:
      - lab
    healthcheck:
      test: ["CMD", "test", "-s", "/publickeys/authorized_keys"]
      interval: 2s
      timeout: 2s
      retries: 15

  nginx:
    <<: *node
    ports:
      - "${HTTP_PORT:-8083}:80"
    volumes:
      - public_keys:/publickeys:ro
      - nginx_hostkeys:/hostkeys

  app:
    <<: *node
    volumes:
      - public_keys:/publickeys:ro
      - app_hostkeys:/hostkeys
      - notes_data:/var/lib/notes

networks:
  lab:

volumes:
  controller_ssh:
  public_keys:
  nginx_hostkeys:
  app_hostkeys:
  notes_data:
